name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/test-requirements.txt
      - name: Offline gate
        run: tests/run-offline.sh
      - name: Live checks are local
        if: always()
        run: echo 'Offline only. The live smoke (install + browser) runs locally with scripts/theme.sh release NAME.' >> "$GITHUB_STEP_SUMMARY"
