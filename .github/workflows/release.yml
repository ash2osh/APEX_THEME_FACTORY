name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/test-requirements.txt
      - name: Offline gate
        run: tests/run-offline.sh
      - name: Build every theme package
        run: |
          mkdir -p release
          for theme in sample-themes/*/; do
            name="$(basename "$theme")"
            scripts/theme.sh release "$name" --offline
            cp dist/"$name"/"$name"-*.zip release/
          done
          scripts/build-demo.sh --output-dir release
          rm release/*.sha256
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
