name: nightly-complete-offline

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/test-requirements.txt
      - name: Run repository-wide offline verification once
        run: tests/run-common-offline.sh
      - name: Check and build every discovered theme
        run: |
          mapfile -t themes < <(python3 -c 'from pathlib import Path; from lib.theme_factory.discovery import theme_names; print(*theme_names(Path.cwd()), sep="\n")')
          for theme in "${themes[@]}"; do
            scripts/theme.sh check "$theme" --no-cache
            scripts/package-theme.sh "$theme" "$RUNNER_TEMP/packages/$theme"
            archive="$(find "$RUNNER_TEMP/packages/$theme" -maxdepth 1 -name '*.zip' -print -quit)"
            python3 -m lib.theme_factory.cli verify-package --package "$archive"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: all-theme-candidates-${{ github.sha }}
          path: ${{ runner.temp }}/packages/**/*.zip
          if-no-files-found: error
      - name: State hosted-runner boundary
        if: always()
        run: echo 'Offline/package checks only. No database import, Chrome session, or Layers C-E verification ran.' >> "$GITHUB_STEP_SUMMARY"
