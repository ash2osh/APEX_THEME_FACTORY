name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/test-requirements.txt
      - name: Lint (pyflakes and bugbear rules)
        run: python -m ruff check --select F,B tools lib tests installer scripts
      - name: Offline gate
        run: tests/run-offline.sh
      - name: Live checks are local
        if: always()
        run: echo 'Offline only. The live smoke (install + browser) runs locally with scripts/theme.sh release NAME.' >> "$GITHUB_STEP_SUMMARY"

  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r tools/test-requirements.txt
      - name: Install, uninstall and restore through the platform's own scripts
        run: python -m unittest tests.test_powershell_scripts tests.test_uninstaller_cli tests.test_installer_cli -v
      - name: Build a package and the demo
        shell: bash
        run: |
          python -m lib.theme_factory.cli release linen --offline --repo-root .
          python tools/build_demo.py --output-dir "$RUNNER_TEMP/demo"
